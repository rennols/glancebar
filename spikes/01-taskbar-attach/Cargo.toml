[package]
name = "taskbar-spike"
version = "0.0.0"
edition = "2021"
publish = false
description = "Throwaway spike 1: clock in the taskbar gap, overlay vs SetParent child"

[dependencies]
slint = { version = "1.19", features = ["raw-window-handle-06"] }
raw-window-handle = "0.6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
debug = 1
